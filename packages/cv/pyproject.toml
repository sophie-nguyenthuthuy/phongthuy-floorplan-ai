[project]
name = "phongthuy-cv"
version = "0.1.0"
description = "Floor plan computer vision — wall/room/door parsing"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "numpy>=2.0",
    "pillow>=10.4",
    # torch is a heavy dep — declare as optional so the API can import phongthuy_cv
    # without pulling 2GB of CUDA wheels. Install via `uv sync --extra torch`.
]

[project.optional-dependencies]
torch = [
    "torch>=2.5",
    "torchvision>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cv"]
