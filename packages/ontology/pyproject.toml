[project]
name = "phongthuy-ontology"
version = "0.1.0"
description = "Phong thủy ontology — bát trạch, cung mệnh, ngũ hành, hướng"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ontology"]

[tool.hatch.build.targets.wheel.force-include]
"src/ontology/data" = "ontology/data"
