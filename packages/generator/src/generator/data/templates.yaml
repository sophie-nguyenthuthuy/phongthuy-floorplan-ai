# House templates — knowledge-as-data for the layout generator.
#
# Coordinate system: meters, origin at the BACK-LEFT corner of the lot.
# x grows rightward, y grows toward the FRONT — the front edge (main door,
# mặt tiền) is at y = depth_m. Plans render with the front at the bottom.
#
# slots: rectangles the engine assigns rooms into.
#   allowed — room rule keys (room_rules.yaml) that may occupy the slot
#   fixed   — pre-assigned room (e.g. giếng trời); engine never moves it
# rooms: the multiset of rooms to place. len(rooms) must equal the number of
#   non-fixed slots. Duplicates allowed (e.g. two bedrooms).

- key: nha_ong_5x20
  label_vi: Nhà ống 5×20m
  description_vi: "Nhà phố điển hình miền xuôi — 1 trệt, giếng trời giữa nhà dẫn khí."
  width_m: 5
  depth_m: 20
  rooms: [phong_khach, phong_bep, phong_ngu, phong_tam, cau_thang]
  slots:
    - { id: s_khach, x: 0, y: 13.5, w: 5, h: 6.5, allowed: [phong_khach] }
    - { id: s_gieng, x: 0, y: 12, w: 5, h: 1.5, fixed: san_gieng_troi }
    - { id: s_mid_trai, x: 0, y: 9, w: 2.5, h: 3, allowed: [phong_tam, cau_thang] }
    - { id: s_mid_phai, x: 2.5, y: 9, w: 2.5, h: 3, allowed: [phong_tam, cau_thang] }
    - { id: s_giua, x: 0, y: 5, w: 5, h: 4, allowed: [phong_bep, phong_an, phong_ngu] }
    - { id: s_sau, x: 0, y: 0, w: 5, h: 5, allowed: [phong_ngu, phong_bep] }
  extra_advice_vi:
    - "Bàn thờ nên đặt ở tầng lửng hoặc tầng trên, tọa cung cát yên tĩnh — tránh đặt trên bếp hoặc WC."
    - "Giếng trời giữa nhà là lá phổi của nhà ống — thêm cây xanh để dưỡng khí."

- key: can_ho_65
