  width_m: 8.2
  depth_m: 8
  rooms: [phong_khach, phong_bep, phong_ngu, phong_tho, phong_tam]
  slots:
    - { id: s_khach, x: 0, y: 4, w: 4.6, h: 4, allowed: [phong_khach] }
    - { id: s_bep, x: 4.6, y: 4, w: 3.6, h: 4, allowed: [phong_bep, phong_an] }
    - { id: s_sau_trai, x: 0, y: 0, w: 4, h: 4, allowed: [phong_ngu, phong_tho] }
    - { id: s_sau_phai, x: 4, y: 0, w: 4.2, h: 2.4, allowed: [phong_ngu, phong_tho, phong_tam] }
