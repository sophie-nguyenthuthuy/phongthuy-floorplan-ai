[project]
name = "phongthuy-dataset"
version = "0.1.0"
description = "VN floor plan dataset — ingestion, labeling, splits"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pillow>=10.4",
    "phongthuy-cv",
]

[tool.uv.sources]
phongthuy-cv = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dataset"]
