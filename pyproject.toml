[project]
name = "phongthuy-floorplan-ai"
version = "0.1.0"
description = "Phong Thủy + Floor Plan AI"
requires-python = ">=3.12"

[tool.uv.workspace]
members = [
    "apps/api",
    "packages/cv",
    "packages/ontology",
    "packages/dataset",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "types-PyYAML>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["apps/mobile"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pyflakes / pycodestyle
    "I",             # isort
    "UP",            # pyupgrade
    "B",             # bugbear
    "SIM",           # simplify
    "RUF",           # ruff
    "TID",           # tidy imports
    "PL",            # pylint subset
]
ignore = ["PLR0913"]  # too-many-arguments — common in routers

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
exclude = ["apps/mobile/"]

[[tool.mypy.overrides]]
module = ["cv.*"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["apps/api/tests", "packages/cv/tests", "packages/ontology/tests", "packages/dataset/tests"]
addopts = "-ra --strict-markers"
