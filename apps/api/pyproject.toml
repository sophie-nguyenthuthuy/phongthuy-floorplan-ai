[project]
name = "phongthuy-api"
version = "0.1.0"
description = "Phong Thủy Floor Plan AI — HTTP API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.17",
    "phongthuy-cv",
    "phongthuy-ontology",
]

[tool.uv.sources]
phongthuy-cv = { workspace = true }
phongthuy-ontology = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]
